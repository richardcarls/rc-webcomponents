name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to recover, such as v0.6.0
        required: true
        type: string
      provenance_exception:
        description: Comma-separated package@version values manually published without provenance
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RC_ALLOW_MISSING_PROVENANCE: ${{ inputs.provenance_exception }}
      RC_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium firefox webkit

      - name: Fetch release refs
        run: git fetch --force origin main:refs/remotes/origin/main --tags

      - name: Validate release tag
        run: yarn validate:release

      - name: Build, validate packages, and test
        run: yarn ci

      # Yarn creates each tarball so workspace:* ranges become real versions. npm performs
      # the registry publish itself so Trusted Publishing can exchange this job's OIDC token.
      - name: Publish and verify packages
        run: yarn publish:packages
