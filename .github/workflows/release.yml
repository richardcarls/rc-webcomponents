name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to recover, such as v0.6.0. Leave empty for a snapshot run.
        required: false
        type: string
      provenance_exception:
        description: Comma-separated package@version values manually published without provenance
        required: false
        type: string
      snapshot:
        description: Publish an unstable @next-style snapshot build from the current ref instead of a recovery run
        required: false
        type: boolean
        default: false
      snapshot_tag:
        description: npm dist-tag to publish the snapshot under
        required: false
        type: string
        default: next

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    if: github.event_name == 'push' || inputs.snapshot != true
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium firefox webkit

      - name: Fetch release refs
        run: git fetch --force origin main:refs/remotes/origin/main --tags

      - name: Validate release tag
        run: yarn validate:release
        env:
          RC_RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Build, validate packages, and test
        run: yarn ci

      # Yarn creates each tarball so workspace:* ranges become real versions. npm performs
      # the registry publish itself so Trusted Publishing can exchange this job's OIDC token.
      - name: Publish and verify packages
        run: yarn publish:packages
        env:
          RC_ALLOW_MISSING_PROVENANCE: ${{ inputs.provenance_exception }}
          RC_RELEASE_TAG: ${{ inputs.release_tag }}

  publish-snapshot:
    name: Publish @next snapshot
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot == true
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium firefox webkit

      - name: Build, validate packages, and test
        run: yarn ci

      # Ephemeral checkout only; never committed or pushed. develop's own
      # committed versions and pending .changeset/*.md files stay untouched.
      - name: Version packages for the snapshot
        run: yarn version:packages:snapshot "${{ inputs.snapshot_tag }}"

      # Catches a fixed-group package that has never been bootstrapped on
      # npm before any live publish is attempted. Without this, a snapshot
      # run publishes every package ahead of the unbootstrapped one, then
      # hard-fails on it with a raw OIDC permission error, leaving the next
      # dist-tag inconsistent across packages.
      - name: Check for packages requiring npm bootstrap
        run: yarn publish:packages:snapshot:dry-run
        env:
          RC_SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}

      # Same tarball packing and OIDC Trusted Publishing flow as a stable
      # release, published under the snapshot dist-tag instead of latest.
      - name: Publish and verify snapshot packages
        run: yarn publish:packages:snapshot
        env:
          RC_SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
