name: Validate

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Only runs the wrapper, which needs no dependencies. Everything else,
      # including the install, happens inside the pinned Playwright image, the
      # same one local runs use.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build, validate packages, and test in the Playwright image
        run: node scripts/playwright-env.mjs ci:host

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: .performance/
          if-no-files-found: ignore

      - name: Upload visual test diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-diffs
          path: .vitest-attachments/
          if-no-files-found: ignore
