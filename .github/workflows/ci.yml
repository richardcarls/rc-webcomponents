name: Validate

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Only runs the wrapper, which needs no dependencies. Everything else,
      # including the install, happens inside the pinned Playwright image, the
      # same one local runs use.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Build, validate packages, and test in the Playwright image
        run: node scripts/playwright-env.mjs ci:host

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: .performance/
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload visual test diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-diffs
          path: .vitest-attachments/
          if-no-files-found: ignore

  blazor-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The fixture compiles the committed C# bindings; validate checks they
      # match the element typings.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile the Blazor event bindings against a Razor fixture
        run: node scripts/test-blazor-bindings.mjs

  server-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Ruby, Bundler, PHP, and Composer come with the runner image.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Imports only the TypeScript range helper, so it needs no install.
      - name: Render the server templates guide with ActionView, Blade, and Razor
        run: node scripts/test-server-templates.mjs
