name: Deploy docs to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      next_ref:
        description: Ref to build the in-development next docs from
        required: false
        type: string
        default: develop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve-refs:
    runs-on: ubuntu-latest
    outputs:
      stable_ref: ${{ steps.resolve.outputs.stable_ref }}
      next_ref: ${{ steps.resolve.outputs.next_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve stable and next refs
        id: resolve
        run: |
          echo "stable_ref=$(git tag -l 'v*' --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"
          echo "next_ref=${{ inputs.next_ref || 'develop' }}" >> "$GITHUB_OUTPUT"

  build-stable:
    needs: resolve-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-refs.outputs.stable_ref }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Generate Custom Elements Manifest
        run: yarn cem:analyze

      - name: Build docs
        run: yarn workspace @rcarls/rc-docs run build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-stable-build
          path: docs/build

  build-next:
    needs: resolve-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-refs.outputs.next_ref }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Generate Custom Elements Manifest
        run: yarn cem:analyze

      - name: Build docs
        run: yarn workspace @rcarls/rc-docs run build:next
        env:
          RC_DOCS_VARIANT: next

      - uses: actions/upload-artifact@v4
        with:
          name: docs-next-build
          path: docs/build-next

  merge:
    needs: [build-stable, build-next]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-stable-build
          path: merged

      - uses: actions/download-artifact@v4
        with:
          name: docs-next-build
          path: merged/next

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: merged

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
